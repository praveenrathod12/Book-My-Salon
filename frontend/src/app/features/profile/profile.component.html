<div class="container page" style="max-width:560px">
  <h1>My profile</h1>
  @if (user(); as u) {
    <div class="card">
      <div class="card-body">
        <div class="profile-head">
          <div class="profile-avatar">{{ u.name[0] }}</div>
          <div>
            <h2 style="margin:0">{{ u.name }}</h2>
            <span class="badge" [class.badge-info]="u.role === 'CUSTOMER'" [class.badge-success]="u.role === 'SALON_OWNER'">
              {{ u.role === 'SALON_OWNER' ? 'Salon Owner' : 'Customer' }}
            </span>
          </div>
        </div>

        <div class="detail-rows">
          <div><span class="label">Email</span><strong>{{ u.email }}</strong></div>
          <div><span class="label">Phone</span><strong>{{ u.phoneNumber || '—' }}</strong></div>
        </div>

        <div class="mt">
          <button class="btn btn-outline" (click)="logout()">Log out</button>
        </div>
      </div>
    </div>
  }
</div>
